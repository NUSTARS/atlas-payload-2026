[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; C++ standard (VectorNav SDK likely uses C++17 features)
build_flags = 
    -std=c++17
    -I./include
    -Wall
    -Wextra

; Increase upload speed (optional, but faster)
upload_speed = 921600

; Monitor settings for Serial debugging
monitor_speed = 115200
monitor_filters = 
    default
    time

; Library dependency mode - search deeply for includes
lib_ldf_mode = deep+

; Uncomment if you need to disable threading in VectorNav SDK
; build_flags = 
;     -std=c++17
;     -I./include
;     -DTHREADING_ENABLE=0